[package]
name = "tap-on-shoulder"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.80"
description = "Claude Code plugin that taps you when a session has been waiting on you."
repository = "https://github.com/karimQuant/tap-on-shoulder"
publish = false
build = "build.rs"

[[bin]]
name = "tap"
path = "src/main.rs"

[lib]
name = "tap"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
libc = "0.2"
getrandom = "0.3"
unicode-normalization = "0.1"
sha2 = "0.10"

[dev-dependencies]
regex = "1"

[build-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
